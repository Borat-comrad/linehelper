[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linehelper"
version = "0.1.0"
description = "Local LineHelper RAG assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf",
    "pypdf",
    "python-docx",
    "streamlit",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
linehelper = "linehelper.cli:main"

[tool.setuptools.packages.find]
include = ["linehelper*"]
